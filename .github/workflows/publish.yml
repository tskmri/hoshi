name: 'publish'

on:
  push:
    tags:
      - 'hoshi-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. hoshi-v1.0.1)'
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: 'windows-latest'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: fetch bundled dictionaries
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/tskmri/hoshi/releases/download/hoshi-v1.0.1/dicts.zip" -OutFile dicts.zip
          Expand-Archive -Path dicts.zip -DestinationPath src-tauri/dictionaries -Force

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          HOSHI_GOOGLE_CLIENT_ID: ${{ secrets.HOSHI_GOOGLE_CLIENT_ID }}
          HOSHI_GOOGLE_CLIENT_SECRET: ${{ secrets.HOSHI_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Hoshi ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'Windows installer and the auto-update metadata used by the app.'
          releaseDraft: true
          prerelease: false
          args: '--bundles nsis'
